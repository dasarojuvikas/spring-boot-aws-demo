name: Java CI/CD

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # CI - BUILD
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package


  # =========================
  # CD - DEPLOY
  # =========================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn clean package

      - name: Stop application and remove old JAR
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ -f /home/ec2-user/app.pid ]; then
              kill $(cat /home/ec2-user/app.pid) || true
              rm -f /home/ec2-user/app.pid
              sleep 5
            fi

            rm -f /home/ec2-user/aws-application-0.0.1-SNAPSHOT.jar

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/aws-application-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/"
          strip_components: 1
          overwrite: true

      - name: Start application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            nohup java -jar /home/ec2-user/aws-application-0.0.1-SNAPSHOT.jar > /home/ec2-user/app.log 2>&1 &
            echo $! > /home/ec2-user/app.pid